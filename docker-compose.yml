services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://fitness:fitness@db:5432/fitness
    depends_on: [db]
volumes:
  pgdata:
